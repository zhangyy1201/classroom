<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智能排座系统 · 教室座位编排</title>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --line:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --primary:#4f46e5; --primary-d:#4338ca;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.topbar{
  height:58px;display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;background:linear-gradient(100deg,#4f46e5,#2563eb 62%,#0ea5e9);
  color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.25);position:relative;z-index:20;
}
.brand{font-weight:700;font-size:17px;letter-spacing:.4px;display:flex;align-items:center;gap:8px;}
.brand .ver{font-size:11px;font-weight:400;opacity:.7;border:1px solid rgba(255,255,255,.4);
  padding:1px 6px;border-radius:20px;}
.top-actions{display:flex;gap:8px;}
.top-actions button{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:.15s;
}
.top-actions button:hover{background:rgba(255,255,255,.3);}
.top-actions button:active{transform:translateY(1px);}
.top-actions button.primary{background:#fff;color:#4338ca;border-color:#fff;font-weight:600;}
.top-actions button:disabled{opacity:.4;cursor:not-allowed;}

/* ---------- 布局 ---------- */
main{display:flex;height:calc(100vh - 58px);}
.sidebar{
  width:346px;flex:0 0 346px;overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:12px;background:#f6f8fb;
  border-right:1px solid var(--line);
}
.card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eef2f7;
  box-shadow:0 1px 3px rgba(15,23,42,.05);}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:700;color:#334155;
  display:flex;align-items:center;gap:6px;}

/* ---------- 表单 ---------- */
select,input[type=number]{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  font-family:inherit;font-size:13px;background:#fff;color:var(--text);outline:none;transition:.15s;
}
select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.row{display:flex;gap:10px;}
.row>*{flex:1;}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);}
.check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#475569;
  margin-top:9px;cursor:pointer;user-select:none;}
.check input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;}
.hint{font-size:11.5px;color:#94a3b8;line-height:1.6;margin-top:8px;}
.hint b{color:#4f46e5;}
button.act{
  width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:#fff;
  color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:.15s;
}
button.act:hover{background:#f8fafc;border-color:#cbd5e1;}
button.act.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
button.act.primary:hover{background:var(--primary-d);}
button.act.big{padding:11px;font-size:14px;margin-top:10px;}
button.act:active{transform:translateY(1px);}
button.act.active{background:#eef2ff;border-color:var(--primary);color:var(--primary-d);font-weight:700;box-shadow:0 0 0 3px rgba(79,70,229,.1);}
.mt8{margin-top:8px;}

/* ---------- 教室模板 ---------- */
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tpl-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;
  border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;
  font-size:11.5px;font-family:inherit;color:#475569;transition:.15s;
}
.tpl-btn .ic{font-size:18px;line-height:1;}
.tpl-btn:hover{border-color:#c7d2fe;background:#f8faff;}
.tpl-btn.active{border-color:var(--primary);background:#eef2ff;color:var(--primary-d);font-weight:700;}

/* ---------- 舞台 ---------- */
.stage{flex:1;overflow:auto;padding:22px 26px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.podium{
  background:linear-gradient(180deg,#334155,#1e293b);color:#e2e8f0;
  padding:9px 90px;border-radius:0 0 16px 16px;font-size:13px;letter-spacing:8px;
  font-weight:600;box-shadow:0 8px 20px rgba(15,23,42,.22);text-indent:8px;
  flex:0 0 auto;
}
.grid-wrap{
  background:#fff;border-radius:16px;padding:22px;border:1px solid #eef2f7;
  box-shadow:0 2px 12px rgba(15,23,42,.07);max-width:100%;overflow:auto;
}
.grid{display:grid;gap:7px;justify-content:center;}

/* ---------- 格子（通用） ---------- */
.cell{
  position:relative;min-height:54px;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:13px;
  transition:all .13s ease;overflow:hidden;padding:2px 4px;
}
.cell.seat{background:#fff;border:1.5px solid #d8e0ec;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:pointer;}
.cell.seat:hover{border-color:var(--primary);box-shadow:0 5px 14px rgba(79,70,229,.2);transform:translateY(-1px);}
.cell.aisle{
  background:repeating-linear-gradient(45deg,#e9eef6,#e9eef6 5px,#f7f9fc 5px,#f7f9fc 10px);
  border:1px dashed #dde5ef;cursor:pointer;
}
.cell.aisle:hover{background:repeating-linear-gradient(45deg,#dbe4f0,#dbe4f0 5px,#eef2f9 5px,#eef2f9 10px);}
.cell.row-aisle{min-height:16px;}
.cell.blank{background:transparent;border:none;pointer-events:none;box-shadow:none;}
.cell.desk{
  background:transparent;border:none;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.cell.desk::after{
  content:'';width:34px;height:34px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#94a3b8,#475569 70%);
  box-shadow:0 2px 8px rgba(15,23,42,.28),inset 0 1px 2px rgba(255,255,255,.4);
}

/* ---------- 智慧教室专属样式 ---------- */
.cell.smart-seat{
  border-radius:50%;
  width:52px;height:52px;min-height:52px;
  margin:0 auto;
  background:#fff;
  border:2px solid #e2e8f0;
  box-shadow:0 1px 4px rgba(15,23,42,.06);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0;
  cursor:pointer;
}
.cell.smart-seat:hover{
  border-color:#818cf8;
  box-shadow:0 4px 14px rgba(99,102,241,.22);
  transform:translateY(-1px);
}
.cell.smart-seat .sname{
  font-size:11.5px;font-weight:600;line-height:1.15;color:#1e293b;
  max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cell.smart-seat .sno{display:none;}
.cell.smart-seat .empty{font-size:10px;color:#cbd5e1;}

.cell.smart-desk{
  border-radius:50%;
  background:linear-gradient(145deg,#e0e7ff,#dbeafe);
  border:2px solid #c7d2fe;
  box-shadow:inset 0 2px 6px rgba(99,102,241,.12),0 2px 8px rgba(99,102,241,.15);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:10px;color:#4338ca;font-weight:700;line-height:1.3;
  width:64px;height:64px;min-height:64px;
  align-self:center;justify-self:center;
  pointer-events:none;
}
.cell.smart-desk .desk-num{font-size:13px;font-weight:800;color:#3730a3;}
.cell.smart-desk .desk-status{font-size:9px;font-weight:400;color:#818cf8;}

/* 过道模式 */
.grid.aisle-mode .cell.seat{border-color:#f59e0b;background:#fffbeb;cursor:crosshair;}
.grid.aisle-mode .cell.seat:hover{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.18);}
.grid.aisle-mode .cell.smart-seat{border-color:#f59e0b;background:#fffbeb;}

.sname{font-weight:600;font-size:13px;line-height:1.15;color:#1e293b;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sno{font-size:9px;color:#94a3b8;margin-top:1px;letter-spacing:.2px;}
.empty{font-size:11px;color:#cbd5e1;}

/* ---------- 统计 ---------- */
.stats{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.9;}
.stats b{color:var(--primary-d);font-size:14px;}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;
  align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(2px);}
.modal.show{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:480px;max-width:92vw;
  box-shadow:0 20px 50px rgba(15,23,42,.3);}
.modal-box h4{margin:0 0 6px;font-size:15px;}
.modal-box textarea{
  width:100%;height:230px;margin-top:10px;padding:10px;border:1px solid var(--line);
  border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
  resize:vertical;outline:none;line-height:1.6;
}
.modal-box textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
.modal-actions button{padding:8px 18px;border-radius:9px;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-family:inherit;font-size:13px;}
.modal-actions button.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);
  background:#1e293b;color:#fff;padding:11px 22px;border-radius:11px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.28s;z-index:300;box-shadow:0 10px 26px rgba(15,23,42,.35);
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 滚动条 ---------- */
.sidebar::-webkit-scrollbar,.stage::-webkit-scrollbar,.grid-wrap::-webkit-scrollbar{width:8px;height:8px;}
.sidebar::-webkit-scrollbar-thumb,.stage::-webkit-scrollbar-thumb,.grid-wrap::-webkit-scrollbar-thumb{
  background:#cbd5e1;border-radius:8px;}
.sidebar::-webkit-scrollbar-track,.stage::-webkit-scrollbar-track,.grid-wrap::-webkit-scrollbar-track{background:transparent;}

/* ---------- 打印 ---------- */
@media print{
  @page{size:landscape;margin:10mm;}
  body{background:#fff;}
  .topbar,.sidebar,.stats,.podium{display:none !important;}
  main{display:block;height:auto;}
  .stage{padding:0;display:block;}
  .grid-wrap{border:none;box-shadow:none;padding:0;margin:0 auto;}
  .cell.seat{border:1px solid #94a3b8;box-shadow:none;}
  .cell.aisle{background:none;border:none;}
  .cell.smart-seat{border:1px solid #94a3b8;}
  .cell.smart-desk{background:#e0e7ff !important;border:1px solid #c7d2fe !important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🪑 智能排座系统 <span class="ver">v1.2</span></div>
  <div class="top-actions">
    <button id="btnUndo" title="撤销上一步操作">↶ 撤销</button>
    <button id="btnImport" title="导入之前导出的座位表">📂 导入</button>
    <button id="btnExport" title="导出为 JSON 文件">📤 导出</button>
    <button id="btnPrint" title="打印或另存为 PDF">🖨️ 打印</button>
    <button id="btnSave" class="primary" title="保存到浏览器本地">💾 保存</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <!-- ① 班级 / 名单 -->
    <section class="card">
      <h3>① 选择班级 / 导入名单</h3>
      <select id="classSelect"></select>
      <div class="row mt8">
        <button class="act" id="btnImportRoster">📁 导入名单</button>
        <button class="act" id="btnTemplate">⬇️ 下载模板</button>
      </div>
      <button class="act mt8" id="btnPasteRoster">📋 手动粘贴名单</button>
      <div class="hint">
        当前名单：<b id="stuCount">0</b> 人
        <span id="classNameLabel" style="display:block;margin-top:2px;"></span>
        <span style="display:block;margin-top:4px;color:#cbd5e1;">支持 CSV / TXT，每行「学号,姓名」或仅姓名</span>
      </div>
    </section>

    <!-- ② 排座方式 -->
    <section class="card">
      <h3>② 排座方式</h3>
      <select id="sortMode">
        <option value="random">🎲 随机排座</option>
        <option value="snoAsc">🔢 按学号升序</option>
        <option value="snoDesc">🔽 按学号降序</option>
        <option value="name">🔤 按姓名排序</option>
      </select>
      <label class="check"><input type="checkbox" id="snake"> 蛇形（S 形）排布</label>
      <button class="act primary big" id="btnArrange">🎯 生成座位</button>
    </section>

    <!-- ③ 教室类型 -->
    <section class="card">
      <h3>③ 教室类型</h3>
      <div class="tpl-grid" id="tplGrid"></div>
      <div class="hint">切换模板会重置当前座位编排</div>
    </section>

    <!-- ④ 手动调整 -->
    <section class="card">
      <h3>④ 手动调整</h3>
      <div class="row">
        <label class="field">行数
          <input type="number" id="rowsInput" min="1" max="30" value="6">
        </label>
        <label class="field">列数
          <input type="number" id="colsInput" min="1" max="30" value="8">
        </label>
      </div>

      <button class="act mt8" id="btnAisleMode">➕ 添加过道</button>
      <div class="hint">
        💡 开启「过道模式」后，点击任意座位即可变成过道；<br>
        <b>双击任意过道</b>即可恢复为座位。
      </div>

      <div class="row mt8">
        <button class="act" id="btnClearAisle">清除所有过道</button>
        <button class="act" id="btnClearSeats">清空座位分配</button>
      </div>
    </section>
  </aside>

  <section class="stage">
    <div class="podium">讲 台</div>
    <div class="grid-wrap">
      <div id="grid" class="grid"></div>
    </div>
    <div id="stats" class="stats"></div>
  </section>
</main>

<!-- 粘贴名单弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h4>粘贴班级名单</h4>
    <p class="hint" style="margin:0">每行一个学生，格式：<code>学号,姓名</code> 或 只写姓名</p>
    <textarea id="rosterText" placeholder="20230101,张伟&#10;20230102,李娜&#10;王小明"></textarea>
    <div class="modal-actions">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="primary">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileInput" accept="application/json" hidden>
<input type="file" id="rosterFileInput" accept=".csv,.txt,text/csv,text/plain" hidden>

<script>
/* =========================================================
   工具函数
   ========================================================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* =========================================================
   演示数据
   ========================================================= */
const SURNAME_LIST = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳'.split('');
const GIVEN_NAMES = ['子涵','浩然','欣怡','雨桐','思远','嘉怡','宇轩','梓涵','明轩','诗琪','俊杰','雅静',
  '天佑','梦琪','伟豪','晓彤','博文','静怡','皓宇','梦洁','锦程','雨欣','泽宇','语嫣','天成','雨萱',
  '文博','思琪','浩宇','佳琪','志强','晓燕','子豪','梦瑶','嘉俊','紫涵','泓宇','雨嘉','逸凡','晨曦',
  '振宇','书瑶','睿轩','婉婷','冠霖','若曦','鑫磊','芷若','子默','月华'];

const NAME_POOL = (() => {
  const pool = [];
  for(const s of SURNAME_LIST) for(const g of GIVEN_NAMES) pool.push(s + g);
  return pool;
})();

function genStudents(count, seed){
  const out = [];
  const start = (seed * 137) % NAME_POOL.length;
  for(let i=0;i<count;i++){
    out.push({
      sno : '2023' + String(seed).padStart(2,'0') + String(i+1).padStart(2,'0'),
      name: NAME_POOL[(start + i * 97) % NAME_POOL.length]
    });
  }
  return out;
}

const CLASS_DATA = [
  { name:'计算机科学与技术2023-1班',    count:42, seed:1 },
  { name:'软件工程2023-2班',            count:38, seed:2 },
  { name:'数据科学与大数据技术2023-1班', count:45, seed:3 },
  { name:'网络空间安全2023-1班',        count:36, seed:4 },
  { name:'人工智能2023-2班',            count:40, seed:5 },
  { name:'电子信息工程2023-3班',        count:34, seed:6 }
];

/* =========================================================
   智慧教室网格构建（6人圆桌）
   ========================================================= */
function buildSmartGrid(nx, ny){
  const deskW = 3, deskH = 4;
  const rows = ny * deskH;
  const cols = nx * deskW;
  // 每个圆桌的图案：
  //   . S .
  //   S T S
  //   S T S
  //   . S .
  const pattern = [
    ['blank', 'seat', 'blank'],
    ['seat',  'desk', 'seat'],
    ['seat',  'desk', 'seat'],
    ['blank', 'seat', 'blank']
  ];
  const grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const lr = r % deskH, lc = c % deskW;
      grid[r][c] = pattern[lr][lc];
    }
  }
  return { rows, cols, grid };
}

function getDeskNumber(r, c){
  const deskW = 3, deskH = 4, nx = 3;
  const deskRow = Math.floor(r / deskH);
  const deskCol = Math.floor(c / deskW);
  return deskRow * nx + deskCol + 1;
}

/* =========================================================
   教室模板
   ========================================================= */
const TEMPLATES = {
  normal: {
    label:'普通教室', ic:'🏫',
    build(){
      const rows = 6, cols = 9;
      const grid = [];
      for(let r=0;r<rows;r++){
        grid[r] = [];
        for(let c=0;c<cols;c++) grid[r][c] = (c === 4) ? 'aisle' : 'seat';
      }
      return { rows, cols, grid };
    }
  },

  multi: {
    label:'多媒体', ic:'🎬',
    build(){
      const rows = 7, cols = 9;
      const grid = [];
      for(let r=0;r<rows;r++){
        grid[r] = [];
        for(let c=0;c<cols;c++) grid[r][c] = (c === 4) ? 'aisle' : 'seat';
      }
      return { rows, cols, grid };
    }
  },

  machine: {
    label:'机房', ic:'🖥️',
    build(){
      const rows = 6;
      const colTypes = [];
      for(let b=0;b<3;b++){
        colTypes.push('seat','seat','seat');
        if(b < 2) colTypes.push('aisle');
      }
      const cols = colTypes.length;
      const grid = [];
      for(let r=0;r<rows;r++){
        grid[r] = [];
        for(let c=0;c<cols;c++) grid[r][c] = colTypes[c];
      }
      return { rows, cols, grid };
    }
  },

  smart: {
    label:'智慧教室', ic:'📺',
    build(){
      const nx = 3;
      const stuCount = state.students.length || 42;
      const deskCount = Math.max(6, Math.ceil(stuCount / 6));
      const ny = Math.ceil(deskCount / nx);
      return buildSmartGrid(nx, ny);
    }
  },

  lab: {
    label:'实验室', ic:'🔬',
    build(){
      const bw = 2, bh = 2;
      const nx = 4, ny = 3;
      const rows = ny * bh + (ny - 1);
      const cols = nx * bw + (nx - 1);
      const grid = [];
      for(let r=0;r<rows;r++){
        grid[r] = [];
        for(let c=0;c<cols;c++){
          const inRow = (r % (bh + 1)) < bh;
          const inCol = (c % (bw + 1)) < bw;
          grid[r][c] = (inRow && inCol) ? 'seat' : 'blank';
        }
      }
      return { rows, cols, grid };
    }
  },

  custom: {
    label:'自定义', ic:'✏️',
    build(){
      const rows = 6, cols = 8;
      const grid = [];
      for(let r=0;r<rows;r++){
        grid[r] = [];
        for(let c=0;c<cols;c++) grid[r][c] = 'seat';
      }
      return { rows, cols, grid };
    }
  }
};

/* =========================================================
   状态
   ========================================================= */
const state = {
  className : '',
  students  : [],
  rows      : 6,
  cols      : 8,
  grid      : [],
  assign    : [],
  history   : [],
  tpl       : 'normal',
  aisleMode : false
};

/* =========================================================
   历史记录
   ========================================================= */
function snapshot(){
  state.history.push({
    rows  : state.rows,
    cols  : state.cols,
    grid  : state.grid.map(r => r.slice()),
    assign: state.assign.map(r => r.slice())
  });
  if(state.history.length > 120) state.history.shift();
  updateUndoBtn();
}

function undo(){
  if(!state.history.length) return;
  const s = state.history.pop();
  state.rows   = s.rows;
  state.cols   = s.cols;
  state.grid   = s.grid;
  state.assign = s.assign;
  render();
  toast('↶ 已撤销');
}

function updateUndoBtn(){
  $('btnUndo').disabled = state.history.length === 0;
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  $('rowsInput').value = state.rows;
  $('colsInput').value = state.cols;
  $('stuCount').textContent = state.students.length;
  $('classNameLabel').textContent = state.className ? '（' + state.className + '）' : '';
  renderTemplates();
  renderGrid();
  renderStats();
  updateUndoBtn();
}

function renderTemplates(){
  const box = $('tplGrid');
  box.innerHTML = '';
  Object.entries(TEMPLATES).forEach(([key, t]) => {
    const b = document.createElement('button');
    b.className = 'tpl-btn' + (state.tpl === key ? ' active' : '');
    b.innerHTML = `<span class="ic">${t.ic}</span><span>${t.label}</span>`;
    b.addEventListener('click', () => applyTemplate(key));
    box.appendChild(b);
  });
}

function renderGrid(){
  const { rows, cols, grid, assign, students } = state;
  const gridEl = $('grid');
  gridEl.innerHTML = '';

  /* ===== 智慧教室：特殊渲染 ===== */
  if(state.tpl === 'smart'){
    gridEl.style.gridTemplateColumns = `repeat(${cols}, 52px)`;
    gridEl.style.gap = '3px';
    gridEl.classList.toggle('aisle-mode', state.aisleMode);

    const frag = document.createDocumentFragment();

    for(let r = 0; r < rows; r++){
      for(let c = 0; c < cols; c++){
        const type = grid[r][c];

        /* ---- 圆桌 ---- */
        if(type === 'desk'){
          // 跳过下半部分（已经被上半部分跨行覆盖）
          if(r > 0 && grid[r-1][c] === 'desk') continue;

          const cell = document.createElement('div');
          cell.className = 'cell smart-desk';
          cell.style.gridColumn = String(c + 1);

          // 判断是否需要跨两行
          let span = 1;
          if(r + 1 < rows && grid[r+1][c] === 'desk') span = 2;
          cell.style.gridRow = (r + 1) + ' / span ' + span;

          const deskNo = getDeskNumber(r, c);
          cell.innerHTML =
            `<div class="desk-num">${deskNo}桌</div>` +
            `<div class="desk-status">开放</div>`;
          cell.title = `${deskNo}号圆桌`;

          frag.appendChild(cell);
          continue;
        }

        /* ---- 座位 ---- */
        if(type === 'seat'){
          const cell = document.createElement('div');
          cell.className = 'cell smart-seat';
          cell.style.gridColumn = String(c + 1);
          cell.style.gridRow = String(r + 1);

          const idx = assign[r][c];
          const st = (idx != null) ? students[idx] : null;
          if(st){
            cell.innerHTML = `<div class="sname">${esc(st.name)}</div>`;
            cell.title = `${st.name}（${st.sno}）`;
          }else{
            cell.innerHTML = '<div class="empty">空</div>';
            cell.title = '空座位';
          }

          cell.addEventListener('click', () => onSeatClick(r, c));
          cell.addEventListener('dblclick', () => onDblClick(r, c));
          frag.appendChild(cell);
          continue;
        }

        /* ---- blank 不渲染 ---- */
      }
    }
    gridEl.appendChild(frag);
    return;
  }

  /* ===== 普通教室（通用渲染） ===== */
  const colTpl = [];
  for(let c=0;c<cols;c++){
    let hasSeat = false;
    for(let r=0;r<rows;r++){
      const t = grid[r][c];
      if(t === 'seat'){ hasSeat = true; break; }
    }
    colTpl.push(hasSeat ? 'minmax(62px, 1fr)' : '20px');
  }

  gridEl.style.gridTemplateColumns = colTpl.join(' ');
  gridEl.style.gap = '7px';
  gridEl.classList.toggle('aisle-mode', state.aisleMode);

  const frag = document.createDocumentFragment();

  for(let r=0;r<rows;r++){
    const rowAllAisle = grid[r].every(v => v === 'aisle' || v === 'blank');
    for(let c=0;c<cols;c++){
      const type = grid[r][c];
      const cell = document.createElement('div');
      cell.className = 'cell ' + type + ((type === 'aisle' && rowAllAisle) ? ' row-aisle' : '');

      if(type === 'seat'){
        const idx = assign[r][c];
        const st = (idx != null) ? students[idx] : null;
        if(st){
          cell.innerHTML =
            `<div class="sname">${esc(st.name)}</div>` +
            `<div class="sno">${esc(st.sno)}</div>`;
          cell.title = `${st.name}（${st.sno}）`;
        }else{
          cell.innerHTML = '<div class="empty">空位</div>';
          cell.title = '空座位';
        }
        cell.addEventListener('click', () => onSeatClick(r, c));
        cell.addEventListener('dblclick', () => onDblClick(r, c));
      }
      else if(type === 'aisle'){
        cell.title = '过道 · 双击恢复为座位';
        cell.addEventListener('click', () => onAisleClick(r, c));
        cell.addEventListener('dblclick', () => onDblClick(r, c));
      }

      frag.appendChild(cell);
    }
  }
  gridEl.appendChild(frag);
}

function renderStats(){
  const { rows, cols, grid, assign } = state;
  let totalSeats = 0, filled = 0;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(grid[r][c] === 'seat'){
        totalSeats++;
        if(assign[r][c] != null) filled++;
      }
    }
  }
  $('stats').innerHTML =
    `座位总数 <b>${totalSeats}</b> · 已安排 <b>${filled}</b> 人 · 班级人数 <b>${state.students.length}</b>`;
}

/* =========================================================
   格子交互
   ========================================================= */
function onSeatClick(r, c){
  if(!state.aisleMode) return;
  snapshot();
  state.grid[r][c] = 'aisle';
  state.assign[r][c] = null;
  render();
}

function onAisleClick(r, c){
  /* 过道单击不做处理，统一交给双击恢复 */
}

function onDblClick(r, c){
  if(state.grid[r][c] !== 'aisle') return;
  snapshot();
  state.grid[r][c] = 'seat';
  render();
  toast('已恢复为座位');
}

/* =========================================================
   网格尺寸调整
   ========================================================= */
function resizeGrid(newRows, newCols){
  const ng = [], na = [];
  for(let r=0;r<newRows;r++){
    ng[r] = []; na[r] = [];
    for(let c=0;c<newCols;c++){
      if(r < state.rows && c < state.cols){
        ng[r][c] = state.grid[r][c];
        na[r][c] = state.assign[r][c];
      }else{
        ng[r][c] = 'seat';
        na[r][c] = null;
      }
    }
  }
  state.rows = newRows;
  state.cols = newCols;
  state.grid = ng;
  state.assign = na;
}

/* =========================================================
   应用教室模板
   ========================================================= */
function applyTemplate(key){
  const t = TEMPLATES[key];
  snapshot();

  const { rows, cols, grid } = t.build();
  state.rows = rows;
  state.cols = cols;
  state.grid = grid;
  state.assign = Array.from({length: rows}, () => Array(cols).fill(null));
  state.tpl = key;

  render();
  toast(`已切换为「${t.label}」布局`);
}

/* =========================================================
   排座核心
   ========================================================= */
function arrangeSeats(){
  if(!state.students.length){ toast('请先选择班级或导入名单'); return; }

  const seatCells = [];
  for(let r=0;r<state.rows;r++)
    for(let c=0;c<state.cols;c++)
      if(state.grid[r][c] === 'seat') seatCells.push([r, c]);

  if(!seatCells.length){ toast('当前没有可用座位，请先添加座位'); return; }

  if(seatCells.length < state.students.length){
    const miss = state.students.length - seatCells.length;
    if(!confirm(`可用座位 ${seatCells.length} 个，少于学生 ${state.students.length} 人。\n将有 ${miss} 名学生无法安排，是否继续？`)) return;
  }

  snapshot();

  for(let r=0;r<state.rows;r++)
    for(let c=0;c<state.cols;c++)
      state.assign[r][c] = null;

  let idxs = state.students.map((_, i) => i);
  const mode = $('sortMode').value;
  if(mode === 'random')       shuffle(idxs);
  else if(mode === 'snoAsc')  idxs.sort((a,b)=> state.students[a].sno.localeCompare(state.students[b].sno));
  else if(mode === 'snoDesc') idxs.sort((a,b)=> state.students[b].sno.localeCompare(state.students[a].sno));
  else if(mode === 'name')    idxs.sort((a,b)=> state.students[a].name.localeCompare(state.students[b].name,'zh-Hans-CN'));

  let ordered = seatCells;
  if($('snake').checked){
    const rowMap = new Map();
    seatCells.forEach(([r,c]) => {
      if(!rowMap.has(r)) rowMap.set(r, []);
      rowMap.get(r).push([r,c]);
    });
    ordered = [];
    [...rowMap.keys()].sort((a,b)=>a-b).forEach((r, i) => {
      const arr = rowMap.get(r);
      if(i % 2 === 1) arr.reverse();
      ordered.push(...arr);
    });
  }

  const n = Math.min(idxs.length, ordered.length);
  for(let i=0;i<n;i++){
    const [r, c] = ordered[i];
    state.assign[r][c] = idxs[i];
  }

  render();
  toast(`✅ 已为 ${n} 名学生排好座位`);
}

/* =========================================================
   班级 / 名单
   ========================================================= */
function loadClass(index){
  const c = CLASS_DATA[index];
  state.className = c.name;
  state.students = genStudents(c.count, c.seed);

  // 如果是智慧教室，根据班级人数重建网格
  if(state.tpl === 'smart'){
    const nx = 3;
    const deskCount = Math.max(6, Math.ceil(c.count / 6));
    const ny = Math.ceil(deskCount / nx);
    const result = buildSmartGrid(nx, ny);
    state.rows = result.rows;
    state.cols = result.cols;
    state.grid = result.grid;
    state.assign = Array.from({length: state.rows}, () => Array(state.cols).fill(null));
  } else {
    state.assign = state.assign.map(row => row.map(() => null));
  }

  render();
}

function openRosterModal(){
  $('rosterText').value = '';
  $('modal').classList.add('show');
  setTimeout(()=> $('rosterText').focus(), 50);
}
function closeRosterModal(){ $('modal').classList.remove('show'); }

function parseRoster(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const students = [];
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    if(i === 0) line = line.replace(/^\uFEFF/, '');

    const parts = line.split(/[,，\t;；]+/).map(s => s.trim()).filter(Boolean);

    if(i === 0 && parts.length >= 2 &&
       /学号|姓名|name|id|no/i.test(parts[0] + parts[1])){
      continue;
    }

    if(parts.length >= 2){
      students.push({ sno: parts[0], name: parts[1] });
    }else if(parts.length === 1 && parts[0]){
      students.push({ sno: String(20230000 + students.length + 1), name: parts[0] });
    }
  }
  return students;
}

function applyRosterStudents(students, label){
  if(!students.length){ toast('未解析到有效学生'); return false; }

  snapshot();
  state.students  = students;
  state.className = label || '手动导入名单';
  state.assign    = state.assign.map(row => row.map(() => null));

  // 智慧教室需重建网格
  if(state.tpl === 'smart'){
    const nx = 3;
    const deskCount = Math.max(6, Math.ceil(students.length / 6));
    const ny = Math.ceil(deskCount / nx);
    const result = buildSmartGrid(nx, ny);
    state.rows = result.rows;
    state.cols = result.cols;
    state.grid = result.grid;
    state.assign = Array.from({length: state.rows}, () => Array(state.cols).fill(null));
  }

  $('classSelect').value = '__custom__';
  render();
  toast(`✅ 已导入 ${students.length} 名学生`);
  return true;
}

function applyRosterFromTextarea(){
  const text = $('rosterText').value.trim();
  if(!text){ toast('名单为空'); return; }
  if(applyRosterStudents(parseRoster(text), '手动粘贴名单')){
    closeRosterModal();
  }
}

function importRosterFile(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const students = parseRoster(String(e.target.result));
      if(!students.length) throw new Error('未解析到学生数据');
      applyRosterStudents(students, file.name.replace(/\.[^.]+$/, ''));
    }catch(err){
      toast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function downloadTemplate(){
  const bom = '\uFEFF';
  const rows = [
    '学号,姓名',
    '20230101,张伟',
    '20230102,李娜',
    '20230103,王小明',
    '20230104,赵敏'
  ];
  const csv = bom + rows.join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = '学生名单模板.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('⬇️ 模板已下载');
}

/* =========================================================
   保存 / 导出 / 导入
   ========================================================= */
function buildPayload(){
  return {
    version  : 3,
    className: state.className,
    savedAt  : new Date().toLocaleString('zh-CN'),
    rows     : state.rows,
    cols     : state.cols,
    grid     : state.grid,
    assign   : state.assign,
    students : state.students,
    tpl      : state.tpl
  };
}

function saveLayout(){
  try{
    localStorage.setItem('smart-seat-layout', JSON.stringify(buildPayload()));
    toast('💾 已保存到本地浏览器');
  }catch(e){
    toast('保存失败：' + e.message);
  }
}

function exportJSON(){
  const data = buildPayload();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const d    = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `座位表_${state.className || '未命名'}_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('📤 已导出 JSON 文件');
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      if(!data.grid || !data.assign) throw new Error('文件格式不正确');
      snapshot();
      state.className = data.className || '导入的座位表';
      state.students  = data.students || [];
      state.rows      = data.rows;
      state.cols      = data.cols;
      state.grid      = data.grid;
      state.assign    = data.assign;
      state.tpl       = data.tpl || 'custom';
      render();
      toast('📂 导入成功');
    }catch(err){
      toast('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   过道模式
   ========================================================= */
function toggleAisleMode(){
  state.aisleMode = !state.aisleMode;
  const btn = $('btnAisleMode');
  btn.classList.toggle('active', state.aisleMode);
  btn.textContent = state.aisleMode ? '✋ 过道模式（点击格子添加）' : '➕ 添加过道';
  $('grid').classList.toggle('aisle-mode', state.aisleMode);
  toast(state.aisleMode
    ? '已进入过道模式：点击任意座位即可变成过道'
    : '已退出过道模式');
}

/* =========================================================
   初始化 & 事件绑定
   ========================================================= */
function init(){
  const sel = $('classSelect');
  CLASS_DATA.forEach((c, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${c.name}（${c.count}人）`;
    sel.appendChild(o);
  });
  const customOpt = document.createElement('option');
  customOpt.value = '__custom__';
  customOpt.textContent = '（自定义名单）';
  customOpt.disabled = true;
  sel.appendChild(customOpt);

  sel.addEventListener('change', () => {
    if(sel.value === '__custom__') return;
    loadClass(+sel.value);
  });

  $('btnPasteRoster').addEventListener('click', openRosterModal);
  $('modalCancel').addEventListener('click', closeRosterModal);
  $('modalOk').addEventListener('click', applyRosterFromTextarea);
  $('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeRosterModal(); });

  $('btnImportRoster').addEventListener('click', () => $('rosterFileInput').click());
  $('rosterFileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) importRosterFile(f);
    e.target.value = '';
  });

  $('btnTemplate').addEventListener('click', downloadTemplate);
  $('btnArrange').addEventListener('click', arrangeSeats);

  $('rowsInput').addEventListener('change', () => {
    if(state.tpl === 'smart'){
      toast('智慧教室布局由圆桌数量自动决定，请切换其他模板调整');
      $('rowsInput').value = state.rows;
      return;
    }
    const v = clamp(parseInt($('rowsInput').value) || 1, 1, 30);
    if(v === state.rows){ $('rowsInput').value = state.rows; return; }
    snapshot();
    resizeGrid(v, state.cols);
    render();
  });

  $('colsInput').addEventListener('change', () => {
    if(state.tpl === 'smart'){
      toast('智慧教室布局由圆桌数量自动决定，请切换其他模板调整');
      $('colsInput').value = state.cols;
      return;
    }
    const v = clamp(parseInt($('colsInput').value) || 1, 1, 30);
    if(v === state.cols){ $('colsInput').value = state.cols; return; }
    snapshot();
    resizeGrid(state.rows, v);
    render();
  });

  $('btnAisleMode').addEventListener('click', toggleAisleMode);

  $('btnClearAisle').addEventListener('click', () => {
    snapshot();
    for(let r=0;r<state.rows;r++)
      for(let c=0;c<state.cols;c++)
        if(state.grid[r][c] === 'aisle') state.grid[r][c] = 'seat';
    render();
    toast('已清除所有过道');
  });

  $('btnClearSeats').addEventListener('click', () => {
    snapshot();
    for(let r=0;r<state.rows;r++)
      for(let c=0;c<state.cols;c++)
        state.assign[r][c] = null;
    render();
    toast('已清空座位分配');
  });

  $('btnUndo').addEventListener('click', undo);
  $('btnSave').addEventListener('click', saveLayout);
  $('btnExport').addEventListener('click', exportJSON);
  $('btnPrint').addEventListener('click', () => window.print());
  $('btnImport').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) importJSON(f);
    e.target.value = '';
  });

  document.addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      undo();
    }
    if(e.key === 'Escape' && state.aisleMode){
      toggleAisleMode();
    }
  });

  applyTemplate('normal');
  loadClass(0);
  $('classSelect').value = '0';
}

document.addEventListener('DOMContentLoaded', init);
</script>
